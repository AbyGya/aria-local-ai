name: Build Aria APK

# Produces installable APKs for Aria.
#
# Every action is pinned to a commit SHA, matching the supply-chain policy the
# rest of this repository's workflows follow (verified by
# `verifySupplyChainPins`). The Android SDK step installs only `platform-tools`:
# the action's default also asks for the legacy `tools` package, which nothing
# in this build uses and which `sdkmanager` intermittently fails to resolve.
# `compileSdk`/`buildTools` are fetched by AGP during the build itself.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build debug APK
        run: ./gradlew assembleFossDebug --stacktrace

      - name: Build release APK
        run: ./gradlew assembleFossRelease --stacktrace
        env:
          RELEASE_KEYSTORE_PATH: ${{ secrets.RELEASE_KEYSTORE_PATH }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aria-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aria-release-apk
          path: app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error

      - name: Publish draft release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@72f46a35477d634ce4b98491a78f9b10a0f5155e # v2.2.1
        with:
          files: app/build/outputs/apk/foss/release/*.apk
          tag_name: v${{ github.run_number }}
          name: Aria v${{ github.run_number }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
