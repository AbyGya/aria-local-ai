name: Build Aria APK

# Produces installable APKs for Aria.
#
# Every action is pinned to a commit SHA, matching the supply-chain policy the
# rest of this repository's workflows follow (verified by
# `verifySupplyChainPins`). The Android SDK step installs only `platform-tools`:
# the action's default also asks for the legacy `tools` package, which nothing
# in this build uses and which `sdkmanager` intermittently fails to resolve.
# `compileSdk`/`buildTools` are fetched by AGP during the build itself.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # The publish step creates a release with the default token, which a
    # workflow gets read-only unless it asks. Scoped to `contents` alone so
    # the rest of the token's write surface stays closed.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build debug APK
        run: ./gradlew assembleFossDebug --stacktrace

      - name: Build release APK
        run: ./gradlew assembleFossRelease --stacktrace
        env:
          RELEASE_KEYSTORE_PATH: ${{ secrets.RELEASE_KEYSTORE_PATH }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aria-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aria-release-apk
          path: app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error

      - name: Publish draft release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ github.run_number }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(app/build/outputs/apk/foss/release/*.apk)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release APK produced; skipping release." >&2
            exit 0
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "Aria ${RELEASE_TAG}" --draft
          fi
